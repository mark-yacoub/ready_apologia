name: Deploy to Cloudflare R2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "r2-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install dependencies
        run: corepack yarn install

      - name: Build Astro site
        run: corepack yarn build
        env:
          NODE_OPTIONS: '--experimental-sqlite'
          SITE_URL: 'https://readyapologia.com'
          PUBLIC_GA_MEASUREMENT_ID: 'G-N4QFGNVW99'

      - name: Sync to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Configure AWS CLI for high resilience with Cloudflare R2
          aws configure set default.s3.max_concurrent_requests 20
          aws configure set default.s3.retry_mode adaptive
          aws configure set default.s3.max_attempts 10

          sync_with_retry() {
            local max_retries=4
            local attempt=1
            local exit_code=0
            while [ $attempt -le $max_retries ]; do
              echo "Starting sync attempt $attempt of $max_retries: $*"
              if "$@"; then
                echo "Sync succeeded on attempt $attempt."
                return 0
              fi
              exit_code=$?
              echo "Sync attempt $attempt failed with code $exit_code. Retrying in 10 seconds..."
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "Sync failed after $max_retries attempts."
            return $exit_code
          }

          # Sync static assets (excluding sw.js and HTML files) with default long-term cache
          sync_with_retry aws s3 sync ./dist s3://ready-apologia-web/ \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --delete \
            --exclude "sw.js" \
            --exclude "*.html"

          # Sync sw.js and HTML files with strict no-cache directive
          sync_with_retry aws s3 sync ./dist s3://ready-apologia-web/ \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --exclude "*" \
            --include "sw.js" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Purge Cloudflare Cache
        if: success()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare cache purge skipped: Secrets CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN are not set."
          else
            curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
                 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                 -H "Content-Type: application/json" \
                 --data '{"purge_everything":true}'
          fi
