name: Deploy to Cloudflare R2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "r2-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: sitemap <lastmod> uses the last commit per content source.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install dependencies
        run: corepack yarn install

      - name: Build Astro site
        run: corepack yarn build
        env:
          NODE_OPTIONS: '--experimental-sqlite'
          SITE_URL: 'https://readyapologia.com'
          PUBLIC_GA_MEASUREMENT_ID: 'G-N4QFGNVW99'
          PUBLIC_CLARITY_PROJECT_ID: 'z4u6yumza1'

      - name: Install rclone (v1.75.2)
        run: |
          set -euo pipefail
          RCLONE_VERSION="v1.75.2"
          RCLONE_ARCHIVE="rclone-${RCLONE_VERSION}-linux-amd64.zip"
          RCLONE_SHA256="349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702"
          cd /tmp
          curl -fsSLO "https://downloads.rclone.org/${RCLONE_VERSION}/${RCLONE_ARCHIVE}"
          echo "${RCLONE_SHA256}  ${RCLONE_ARCHIVE}" | sha256sum -c -
          unzip -q -o "${RCLONE_ARCHIVE}"
          echo "/tmp/rclone-${RCLONE_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      # Upload ONLY files whose content changed (MD5 vs R2 ETag), instead of
      # re-uploading all ~120K files on every build (aws s3 sync compares mtimes,
      # which are new on every CI build, and burned ~35K Class A ops per deploy).
      - name: Sync to Cloudflare R2 (content-changed files only)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          COMMON="--checksum --fast-list --transfers 32 --checkers 64 --retries 5 --low-level-retries 20 --stats 30s --stats-one-line"

          # 1) Copy static assets (hashed bundles, images, JSON, sitemaps…) without
          #    deleting old bundles yet, so cached HTML never references deleted assets
          #    before new HTML is uploaded and the edge cache is purged.
          rclone copy ./dist r2:ready-apologia-web $COMMON \
            --exclude "*.html" --exclude "sw.js"

          # 2) HTML + service worker: browsers must always revalidate (the CDN edge
          #    cache is purged in the next step). Removed pages are deleted too.
          rclone sync ./dist r2:ready-apologia-web $COMMON \
            --include "*.html" --include "sw.js" \
            --header-upload "Cache-Control: no-cache, must-revalidate"

      - name: Purge Cloudflare Cache
        if: success()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare cache purge skipped: Secrets CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN are not set."
          else
            RESPONSE=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
                 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                 -H "Content-Type: application/json" \
                 --data '{"purge_everything":true}')
            echo "$RESPONSE"
            if ! echo "$RESPONSE" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "::error::Cloudflare cache purge failed"
              exit 1
            fi
          fi

      - name: Delete stale assets from Cloudflare R2
        if: success()
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          COMMON="--checksum --fast-list --transfers 32 --checkers 64 --retries 5 --low-level-retries 20 --stats 30s --stats-one-line"

          # 4) After new HTML is live and the edge cache is purged, sync static assets
          #    to delete stale bundles that are no longer referenced.
          rclone sync ./dist r2:ready-apologia-web $COMMON \
            --exclude "*.html" --exclude "sw.js"
